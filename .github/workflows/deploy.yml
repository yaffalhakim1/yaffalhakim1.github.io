name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          profile: minimal

      - uses: Swatinem/rust-cache@v2

      # Refresh the Steam snapshot when the repo has the credentials. Without
      # them (or if Steam is unreachable) the committed snapshot is used, so a
      # transient API failure can never break a deploy.
      - name: Refresh Steam snapshot
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: |
          if [ -z "$STEAM_API_KEY" ] || [ -z "$STEAM_ID" ]; then
            echo "Steam secrets not configured; using committed snapshot."
            exit 0
          fi
          cargo run -- --refresh-steam || echo "Steam refresh failed; using committed snapshot."

      - name: Export static site
        run: cargo run -- --export dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
